slides:
  - image: assets/images/uploads/dog-perley-health.jpg
    title: There’s something special about the days when a dog comes to visit 🐾
    quote: For our residents, a visit can bring back happy memories or brighten
      their day. Quality of life is about more than physical care—it’s music,
      friendship, kindness, and sometimes, a wagging tail and a wet nose.
    author_name: Delphine Haslé, CEO - Foundation
  - image: assets/images/uploads/2026-07-08_delphinehaslé_20247_cropped.jpg
    title: From the bottom of my heart
    quote: Thank you for believing that everyone deserves a fulfilling life at every
      age. Your generosity is helping transform care for Veterans and seniors
      today, and making better aging possible for generations to come.
    author_name: Delphine Haslé, CFRE
    author_title: Chief Executive Officer
    author_company: Perley Health Foundation
  - image: assets/images/uploads/26-05-comfort-care-carts.png
    title: Comfort Care Carts
    quote: Comfort Care Carts and Chairs allow a family member or care partner to
      stay close, and rest when they need to while still being present with
      their resident. Read how your generosity impacts end-of-life care on the
      blog
    author_name: Perley Health Foundation
    cta: www.PerleyHealthFoundation.ca/stories/blog
  - image: assets/images/uploads/deborah-s-gift-boutique-staff.jpeg
    title: A Little Shop With A Big Legacy
    quote: This year, Deborah’s Gift Boutique celebrates 30 years of bringing joy to
      the Perley Health community. Thanks to dedicated volunteers and loyal
      shoppers, the boutique has donated more than $700,000 to support care and
      programs for Veterans and seniors.
    author_name: Perley Health Foundation
    cta: Read his story in the latest issue of Honour and Care or visit
      https://perleyhealthfoundation.ca/stories/blog/a-gentle-landing/
  - image: assets/images/uploads/untitled-design.png
    title: O2E Staff Recognized as Champions of Care
    quote: Congratulations to members of Ottawa 2 East for being recognized as
      Champions of Care! 🏆❤️ Your dedication, compassion, and hard work make
      all the difference. Thank you for always going above and beyond! 👏
    author_name: "A Grateful Family "
    cta: "To recognize a Champion of Care visit,
      https://perleyhealthfoundation.ca/champions-care/ "
