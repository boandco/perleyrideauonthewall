  - layout: landscape
    title: Thank you Veteran Society Motorcycle Club!
    description: We are so grateful to the Veteran Society Motorcycle Club for their
      annual visit to Perley Health, and generous gift to support the Veterans
      within Perley Health. Residents always love seeing their motorcycles and
      appreciate the time spent together with club members.
    image: assets/images/uploads/image-77-.jpg
  - image: assets/images/uploads/perleyhealth_donorreception-2172.jpg
    layout: portrait
    title: Thank You for Making the New Intergenerational Early Learning Centre
      Possible!
    description: >-
      The new Intergenerational Early Learning Centre at Perley Health has been
      made possible through the generosity of donors who support the Bridging
      Generations campaign.


      Soon, little ones, Veterans, and Seniors will come together every day to share meals, stories, laughter, and meaningful moments.
  - layout: landscape
    image: assets/images/uploads/img_e5860.jpg
    title: "Welcome to the Century Club, Royal Canadian Legion! "
    description: We were thrilled to welcome the Royal Canadian Legion into the
      Perley Health Century Club this year in recognition of their 100th
      Anniversary.
  - layout: landscape
    image: assets/images/uploads/perleyhealth_strawberrysocial_r2-1637.jpg
    title: "Thank You Royal Canadian Legion Br 638 Kanata! "
    description: We are so grateful for the members of Branch 638 in Kanata for your
      lasting support of the Veterans at Perley Health.
  - layout: landscape
    image: assets/images/uploads/cnw_04-22-26_vac_113.jpg
    description: Thank you to Deborah’s Gift Boutique for their generous $35,000
      donation in support of our Bridging Generations Campaign, helping make our
      new Intergenerational Early Learning Centre possible.
    title: Thank you to Deborah’s Gift Boutique
  - layout: landscape
    title: Thank You Royal Canadian Legion Br 625 Richmond!
    description: Thank you for your generous donation, and ongoing commitment to the
      support, betterment and safety of the Veterans at Perley Health.
    image: assets/images/uploads/2026-rcl-richmond-cheque-presentation.jpg
  - layout: portrait
    image: assets/images/uploads/rcl.png
    title: "Thank You Royal Canadian Legion Br 462 Eastview! "
    description: >-
      Thank you for your generous donation, which was presented to Perley Health
      Foundation at the Branch’s annual Honours & Awards Ceremony. This gift is
      being directed to purchase three pieces of equipment that will provide
      dignity, independence, comfort, and care to Veterans at Perley Health. 


      Eastview Branch Member and Perley Health resident Roland Lalonde also generously donated a painting he made at Perley Health’s art studio to the Branch.
  - image: assets/images/uploads/ott-stacked-full-colour-en.png
    layout: portrait
    description: >-
      Commissionaires Ottawa is making a transformative investment in the future
      of long-term care, through a historic $3 million gift to Building for
      Belonging. The gift will help develop a new model of care designed to
      foster joy, purpose and belonging. It honours the service of today’s
      Veterans while helping ensure that future generations can access the
      extraordinary care they deserve.


      > *“Commissionaires Ottawa was built to serve those who have served, and that commitment doesn’t end when a Veteran’s working life does. We have seen first-hand the difference Perley Health’s care makes in the lives of Veterans, seniors and their families. With this gift, we’re proud to help build a place where future generations will find dignity, purpose and community. It’s our way of telling every Veteran that their service is remembered, and that their community is here for them.”*

      >

      > Michel Charron, Chief Executive Officer, Commissionaires Ottawa
    title: Thank you Commissionaires Ottawa!
